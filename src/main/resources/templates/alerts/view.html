<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head(#{alerts.title})}"></head>
<body th:replace="~{fragments/layout :: body(~{::section}, 'alerts')}">
<section x-data="{ tab: 'critical' }">
    <h1 class="text-xl font-semibold mb-3" th:text="#{alerts.title}">Alerts</h1>

    <div class="grid grid-cols-4 bg-white border border-slate-200 rounded-xl mb-3 overflow-hidden text-sm">
        <button type="button" @click="tab='expired'"
                :class="tab==='expired' ? 'bg-red-50 text-red-700 font-semibold' : 'text-slate-600'"
                class="py-2.5 flex flex-col items-center">
            <span class="text-lg font-bold" th:text="${view.expired.size()}"></span>
            <span>Expired</span>
        </button>
        <button type="button" @click="tab='critical'"
                :class="tab==='critical' ? 'bg-red-50 text-red-700 font-semibold' : 'text-slate-600'"
                class="py-2.5 flex flex-col items-center">
            <span class="text-lg font-bold" th:text="${view.critical.size()}"></span>
            <span>&lt; 30d</span>
        </button>
        <button type="button" @click="tab='near'"
                :class="tab==='near' ? 'bg-amber-50 text-amber-700 font-semibold' : 'text-slate-600'"
                class="py-2.5 flex flex-col items-center">
            <span class="text-lg font-bold" th:text="${view.near.size()}"></span>
            <span>&lt; 90d</span>
        </button>
        <button type="button" @click="tab='low'"
                :class="tab==='low' ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-slate-600'"
                class="py-2.5 flex flex-col items-center">
            <span class="text-lg font-bold" th:text="${view.lowStock.size()}"></span>
            <span>Low stock</span>
        </button>
    </div>

    <div x-show="tab==='expired'" x-cloak>
        <form sec:authorize="hasAnyRole('OWNER','PHARMACIST')"
              th:if="${!#lists.isEmpty(view.expired)}" th:action="@{/inventory/write-off-expired}" method="post"
              class="mb-3 flex justify-end">
            <button type="submit" class="text-xs bg-red-600 text-white px-3 py-1.5 rounded-lg"
                    onclick="return confirm('Write off all expired batches? This sets their quantity to 0.')">
                Write off all expired
            </button>
        </form>
        <div th:if="${#lists.isEmpty(view.expired)}" class="text-center text-slate-500 py-8">No expired stock 🎉</div>
        <ul class="space-y-2">
            <li th:each="b : ${view.expired}"
                th:with="m=${view.medicinesById[b.medicineId]}, days=${-view.daysToExpiry[b.id]}"
                class="bg-white border border-red-200 rounded-xl p-3">
                <a th:href="@{/inventory/medicines/{id}(id=${b.medicineId})}" class="block">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="font-medium" th:text="${m != null ? m.name : 'Medicine ' + b.medicineId}"></div>
                            <div class="text-xs text-slate-500" th:text="'batch #' + ${b.batchNumber}"></div>
                        </div>
                        <div class="text-right">
                            <div class="font-semibold text-red-600" th:text="${b.quantity}"></div>
                            <div class="text-xs text-red-600" th:text="${days} + 'd expired'"></div>
                        </div>
                    </div>
                </a>
            </li>
        </ul>
    </div>

    <div x-show="tab==='critical'">
        <div th:if="${#lists.isEmpty(view.critical)}" class="text-center text-slate-500 py-8">Nothing expiring in 30 days.</div>
        <ul class="space-y-2">
            <li th:each="b : ${view.critical}"
                th:with="m=${view.medicinesById[b.medicineId]}, days=${view.daysToExpiry[b.id]}"
                class="bg-white border border-red-200 rounded-xl p-3">
                <a th:href="@{/inventory/medicines/{id}(id=${b.medicineId})}" class="block">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="font-medium" th:text="${m != null ? m.name : 'Medicine ' + b.medicineId}"></div>
                            <div class="text-xs text-slate-500" th:text="'batch #' + ${b.batchNumber}"></div>
                        </div>
                        <div class="text-right">
                            <div class="font-semibold" th:text="${b.quantity}"></div>
                            <div class="text-xs text-red-600" th:text="${days} + 'd left'"></div>
                        </div>
                    </div>
                </a>
            </li>
        </ul>
    </div>

    <div x-show="tab==='near'" x-cloak>
        <div th:if="${#lists.isEmpty(view.near)}" class="text-center text-slate-500 py-8">Nothing expiring in 90 days.</div>
        <ul class="space-y-2">
            <li th:each="b : ${view.near}"
                th:with="m=${view.medicinesById[b.medicineId]}, days=${view.daysToExpiry[b.id]}"
                class="bg-white border border-amber-200 rounded-xl p-3">
                <a th:href="@{/inventory/medicines/{id}(id=${b.medicineId})}" class="block">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="font-medium" th:text="${m != null ? m.name : 'Medicine ' + b.medicineId}"></div>
                            <div class="text-xs text-slate-500" th:text="'batch #' + ${b.batchNumber}"></div>
                        </div>
                        <div class="text-right">
                            <div class="font-semibold" th:text="${b.quantity}"></div>
                            <div class="text-xs text-amber-600" th:text="${days} + 'd left'"></div>
                        </div>
                    </div>
                </a>
            </li>
        </ul>
    </div>

    <div x-show="tab==='low'" x-cloak>
        <div th:if="${#lists.isEmpty(view.lowStock)}" class="text-center text-slate-500 py-8">No low-stock medicines.</div>
        <ul class="space-y-2">
            <li th:each="e : ${view.lowStock}"
                class="bg-white border border-primary-200 rounded-xl p-3">
                <a th:href="@{/inventory/medicines/{id}(id=${e.medicine.id})}" class="block">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="font-medium" th:text="${e.medicine.name}"></div>
                            <div class="text-xs text-slate-500"
                                 th:text="'reorder when ≤ ' + ${e.threshold}"></div>
                        </div>
                        <div class="text-right">
                            <div class="font-semibold text-primary-700" th:text="${e.currentStock}"></div>
                            <div class="text-xs text-primary-700">in stock</div>
                        </div>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</section>
</body>
</html>
