<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title th:text="${title} + ' · ClinicOps'">ClinicOps</title>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml"/>
    <link rel="apple-touch-icon" href="/icons/icon-192.svg"/>
    <!-- Tailwind Play script (self-hosted). Configuration is applied right after via tailwind.config = ... -->
    <script src="/vendor/tailwind-3.4.16.min.js"></script>
    <script th:inline="javascript">
        // ---- THEME ---- Picked per-user (ThemeAdvice). Choices: violet · sky · emerald
        const PALETTES = {
            violet: {
                50:'#f5f3ff', 100:'#ede9fe', 200:'#ddd6fe', 300:'#c4b5fd', 400:'#a78bfa',
                500:'#8b5cf6', 600:'#7c3aed', 700:'#6d28d9', 800:'#5b21b6', 900:'#4c1d95'
            },
            sky: {
                50:'#f0f9ff', 100:'#e0f2fe', 200:'#bae6fd', 300:'#7dd3fc', 400:'#38bdf8',
                500:'#0ea5e9', 600:'#0284c7', 700:'#0369a1', 800:'#075985', 900:'#0c4a6e'
            },
            indigo: {
                50:'#eef2ff', 100:'#e0e7ff', 200:'#c7d2fe', 300:'#a5b4fc', 400:'#818cf8',
                500:'#6366f1', 600:'#4f46e5', 700:'#4338ca', 800:'#3730a3', 900:'#312e81'
            }
        };
        const __theme = /*[[${theme} ?: 'violet']]*/ 'violet';
        const __palette = PALETTES[__theme] || PALETTES.violet;
        tailwind.config = { theme: { extend: { colors: { primary: __palette } } } };

        // Sync browser chrome to the chosen theme
        document.head.insertAdjacentHTML('beforeend',
            '<meta name="theme-color" content="' + __palette[600] + '">');
    </script>
    <script src="/vendor/htmx-1.9.12.min.js"></script>
    <script defer src="/vendor/alpine-3.14.1.min.js"></script>
    <link rel="stylesheet" href="/css/app.css"/>
    <!-- Hide Alpine-cloaked elements until Alpine.js initializes.
         Inlined here so it cannot be defeated by a stale service-worker CSS cache. -->
    <style>
        [x-cloak] { display: none !important; }
        /* HTMX loading indicator: hidden by default, visible during requests */
        .htmx-indicator { display: none !important; }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator { display: flex !important; }
    </style>
</head>
<body th:fragment="body(content, active)" class="bg-slate-50 min-h-screen text-slate-800">

<header class="sticky top-0 z-30 bg-primary-600 text-white shadow">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="/" class="font-semibold text-lg flex items-center gap-1.5" th:text="#{app.name}">ClinicOps</a>
        <div class="flex items-center gap-3 text-sm">
            <span sec:authentication="principal.fullName" class="opacity-90 hidden sm:inline"></span>
            <!-- Language switcher -->
            <div class="flex items-center gap-1 text-xs opacity-90">
                <a href="?lang=en"
                   th:classappend="${#locale.language == 'en'} ? 'font-semibold underline' : ''">EN</a>
                <span>|</span>
                <a href="?lang=ta"
                   th:classappend="${#locale.language == 'ta'} ? 'font-semibold underline' : ''">த</a>
            </div>
            <!-- Settings gear — accessible from header on every page; clinic users only -->
            <a sec:authorize="!hasRole('PLATFORM_ADMIN')" href="/settings"
               class="opacity-80 hover:opacity-100" title="Settings">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.3 3.6a1.7 1.7 0 013.4 0c.05.39.27.74.6.95.34.21.76.27 1.14.16a1.7 1.7 0 012.13 2.13c-.11.38-.05.8.16 1.14.21.34.56.55.95.6a1.7 1.7 0 010 3.4 1.7 1.7 0 00-.95.6 1.7 1.7 0 00-.16 1.14 1.7 1.7 0 01-2.13 2.13 1.7 1.7 0 00-1.14.16 1.7 1.7 0 00-.6.95 1.7 1.7 0 01-3.4 0 1.7 1.7 0 00-.6-.95 1.7 1.7 0 00-1.14-.16 1.7 1.7 0 01-2.13-2.13c.11-.38.05-.8-.16-1.14a1.7 1.7 0 00-.95-.6 1.7 1.7 0 010-3.4c.39-.05.74-.27.95-.6.21-.34.27-.76.16-1.14a1.7 1.7 0 012.13-2.13c.38.11.8.05 1.14-.16.34-.21.55-.56.6-.95zM12 14a2 2 0 100-4 2 2 0 000 4z"/>
                </svg>
            </a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="opacity-90 hover:opacity-100" type="submit" th:text="#{nav.logout}">Logout</button>
            </form>
        </div>
    </div>
</header>

<!-- Draft-translation banner — visible only when Tamil is active. -->
<div th:if="${#locale.language == 'ta'}"
     class="bg-amber-50 border-b border-amber-200 text-amber-900 text-xs px-4 py-1.5 text-center">
    ⚠ <span th:text="#{draft.translation.banner}"></span>
</div>

<main class="max-w-3xl mx-auto px-4 pt-4 pb-28">
    <!-- Flash toast: shown once after a successful action (RedirectAttribute "flash"). Auto-dismisses. -->
    <div th:if="${flash}" role="status"
         x-data="{ show: true }" x-init="setTimeout(() => show = false, 4000)"
         x-show="show" x-transition
         class="mb-3 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm flex items-center justify-between">
        <span>✓ <span th:text="${flash}"></span></span>
        <button type="button" @click="show = false" class="text-emerald-700 text-xs">dismiss</button>
    </div>
    <!-- Info toast: neutral blue — used for "already exists" / informational notices. -->
    <div th:if="${flashInfo}" role="status"
         x-data="{ show: true }" x-init="setTimeout(() => show = false, 5000)"
         x-show="show" x-transition
         class="mb-3 p-3 rounded-lg bg-sky-50 border border-sky-200 text-sky-800 text-sm flex items-center justify-between">
        <span>ℹ <span th:text="${flashInfo}"></span></span>
        <button type="button" @click="show = false" class="text-sky-700 text-xs">dismiss</button>
    </div>
    <div th:replace="${content}">page content</div>
</main>

<!-- Clinic nav — every role except PLATFORM_ADMIN. -->
<!--
  5 primary tabs: Dashboard · Patients · Appointment · Sale · More
  "More" opens a slide-up drawer containing Alerts + Purchases + Inventory (role-guarded).
  The "More" button itself is highlighted when the current page is alerts, purchases, or inventory.
-->
<nav sec:authorize="!hasRole('PLATFORM_ADMIN')"
     class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-30"
     x-data="{ moreOpen: false }">

    <!-- ── More drawer ─────────────────────────────────────────────────── -->
    <!-- Backdrop: tap anywhere above the drawer to close -->
    <div x-show="moreOpen"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="moreOpen = false"
         class="fixed inset-0 bottom-14 bg-black/25 z-40"
         style="display:none"></div>

    <!-- Drawer panel -->
    <div x-show="moreOpen"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-4"
         class="fixed bottom-14 inset-x-0 z-50 max-w-3xl mx-auto
                bg-white border-t border-slate-200 shadow-xl rounded-t-2xl px-4 py-3"
         style="display:none">

        <div class="flex items-center justify-between mb-3">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">More</span>
            <button @click="moreOpen = false"
                    class="text-slate-400 hover:text-slate-600 text-lg leading-none">×</button>
        </div>

        <div class="grid grid-cols-3 gap-2">

            <!-- Alerts -->
            <a href="/alerts" @click="moreOpen = false"
               class="flex flex-col items-center gap-1 py-3 rounded-xl text-xs transition-colors hover:bg-slate-50"
               th:classappend="${active == 'alerts'} ? 'text-primary-600 font-semibold bg-primary-50' : 'text-slate-600'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5m6 0a3 3 0 11-6 0"/>
                </svg>
                <span th:text="#{nav.alerts}">Alerts</span>
            </a>

            <!-- Purchases — OWNER / PHARMACIST only -->
            <a href="/purchases" @click="moreOpen = false"
               sec:authorize="hasAnyRole('OWNER','PHARMACIST')"
               class="flex flex-col items-center gap-1 py-3 rounded-xl text-xs transition-colors hover:bg-slate-50"
               th:classappend="${active == 'purchases'} ? 'text-primary-600 font-semibold bg-primary-50' : 'text-slate-600'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
                <span>Purchases</span>
            </a>

            <!-- Inventory — OWNER / DOCTOR / PHARMACIST only -->
            <a href="/inventory" @click="moreOpen = false"
               sec:authorize="hasAnyRole('OWNER','DOCTOR','PHARMACIST')"
               class="flex flex-col items-center gap-1 py-3 rounded-xl text-xs transition-colors hover:bg-slate-50"
               th:classappend="${active == 'inventory'} ? 'text-primary-600 font-semibold bg-primary-50' : 'text-slate-600'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
                </svg>
                <span>Inventory</span>
            </a>

        </div>
    </div>

    <!-- ── Primary tab bar ─────────────────────────────────────────────── -->
    <div class="max-w-3xl mx-auto grid grid-cols-5 text-xs">

        <!-- Dashboard -->
        <a href="/" class="flex flex-col items-center py-2 transition-colors"
           th:classappend="${active == 'dashboard'} ? 'text-primary-600 font-semibold' : 'text-slate-500'">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <span>Dashboard</span>
        </a>

        <!-- Patients -->
        <a href="/patients" class="flex flex-col items-center py-2 transition-colors"
           th:classappend="${active == 'patients'} ? 'text-primary-600 font-semibold' : 'text-slate-500'">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span th:text="#{nav.patients}">Patients</span>
        </a>

        <!-- Appointment -->
        <a href="/appointments" class="flex flex-col items-center py-2 transition-colors"
           th:classappend="${active == 'schedule'} ? 'text-primary-600 font-semibold' : 'text-slate-500'">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span>Appointment</span>
        </a>

        <!-- Sale -->
        <a href="/sales" class="flex flex-col items-center py-2 transition-colors"
           th:classappend="${active == 'sale'} ? 'text-primary-600 font-semibold' : 'text-slate-500'"
           sec:authorize="hasAnyRole('OWNER','DOCTOR','PHARMACIST')">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
            <span>Sale</span>
        </a>

        <!-- More — highlighted when current page lives in the drawer -->
        <button type="button"
                @click="moreOpen = !moreOpen"
                class="flex flex-col items-center py-2 transition-colors w-full"
                th:classappend="${active == 'alerts' or active == 'purchases' or active == 'inventory'} ? 'text-primary-600 font-semibold' : 'text-slate-500'">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M5 12h.01M12 12h.01M19 12h.01M6 12a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0zm7 0a1 1 0 11-2 0 1 1 0 012 0z"/>
            </svg>
            <span>More</span>
        </button>

    </div>
</nav>

<!-- Platform-admin nav — only Platform Home / Terms / Masters / Logout. No clinical surfaces. -->
<nav sec:authorize="hasRole('PLATFORM_ADMIN')"
     class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-30">
    <div class="max-w-3xl mx-auto grid grid-cols-4 text-xs">
        <a href="/platform" class="flex flex-col items-center py-2"
           th:classappend="${active == 'platform'} ? 'text-primary-600 font-semibold' : 'text-slate-500'">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7m-9 11V10m4 11V10"/></svg>
            <span th:text="#{nav.platform.home}">Home</span>
        </a>
        <a href="/platform/terms" class="flex flex-col items-center py-2 text-slate-500">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span th:text="#{nav.platform.terms}">Terms</span>
        </a>
        <a href="/platform/degrees" class="flex flex-col items-center py-2 text-slate-500">
            <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
            <span th:text="#{nav.platform.masters}">Masters</span>
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="w-full flex flex-col items-center py-2 text-slate-500">
                <svg class="w-6 h-6 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                <span th:text="#{nav.logout}">Logout</span>
            </button>
        </form>
    </div>
</nav>

<script src="/js/app.js"></script>
</body>
</html>
