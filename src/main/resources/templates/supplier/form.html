<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Supplier')}"></head>
<body th:replace="~{fragments/layout :: body(~{::section}, 'purchases')}">
<section>
    <div class="flex items-center gap-3 mb-4">
        <a href="/suppliers" class="text-primary-600">←</a>
        <h1 class="text-xl font-semibold" th:text="${supplier.id != null} ? 'Edit Supplier' : 'New Supplier'"></h1>
    </div>

    <form th:action="${supplier.id != null} ? @{/suppliers/{id}(id=${supplier.id})} : @{/suppliers}"
          method="post" th:object="${supplier}" class="space-y-6">
        <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>

        <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Contact</h2>
            <div>
                <label class="text-sm font-medium text-slate-700">Name *</label>
                <input th:field="*{name}" required autofocus
                       class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-xs text-red-600 mt-1"></p>
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700">Phone</label>
                <input th:field="*{phone}" type="tel" inputmode="numeric"
                       pattern="^[6-9][0-9]{9}$" maxlength="10" placeholder="9876543210"
                       class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
                <p class="text-xs text-slate-400 mt-1">10-digit Indian mobile</p>
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-xs text-red-600 mt-1"></p>
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700">Address</label>
                <input th:field="*{address}"
                       class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700">GSTIN</label>
                <input th:field="*{gstin}" placeholder="22AAAAA0000A1Z5"
                       pattern="^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9][A-Z][0-9A-Z]$" maxlength="15"
                       class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none uppercase"
                       style="text-transform: uppercase"/>
                <p th:if="${#fields.hasErrors('gstin')}" th:errors="*{gstin}" class="text-xs text-red-600 mt-1"></p>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Bank transfer (NEFT / IMPS)</h2>
            <div>
                <label class="text-sm font-medium text-slate-700">Account holder name</label>
                <input th:field="*{bankAccountName}"
                       class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-sm font-medium text-slate-700">Account number</label>
                    <input th:field="*{bankAccountNumber}" inputmode="numeric"
                           class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-700">IFSC</label>
                    <input th:field="*{bankIfsc}" placeholder="HDFC0001234"
                           pattern="^[A-Z]{4}0[A-Z0-9]{6}$" maxlength="11"
                           class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none uppercase"
                           style="text-transform: uppercase"/>
                    <p th:if="${#fields.hasErrors('bankIfsc')}" th:errors="*{bankIfsc}" class="text-xs text-red-600 mt-1"></p>
                </div>
            </div>
            <div>
                <label class="text-sm font-medium text-slate-700">Bank name &amp; branch</label>
                <input th:field="*{bankName}" placeholder="e.g. HDFC Bank, MG Road branch"
                       class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold">UPI</h2>
            <div>
                <label class="text-sm font-medium text-slate-700">UPI ID</label>
                <input th:field="*{upiId}" placeholder="name@bank"
                       class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 p-4 space-y-3">
            <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Notes</h2>
            <textarea th:field="*{notes}" rows="2" placeholder="Payment terms, credit days, contact person…"
                      class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-lg">
            Save
        </button>
    </form>
</section>
</body>
</html>
