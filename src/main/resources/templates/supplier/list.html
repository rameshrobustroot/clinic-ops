<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(#{suppliers.list.title})}"></head>
<body th:replace="~{fragments/layout :: body(~{::section}, 'purchases')}">
<section>
    <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
            <a href="/purchases" class="text-primary-600">←</a>
            <h1 class="text-xl font-semibold" th:text="#{suppliers.list.title}">Suppliers</h1>
        </div>
        <a href="/suppliers/new"
           class="bg-primary-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-primary-700"
           th:text="#{suppliers.list.add}">+ Add</a>
    </div>

    <div th:if="${#lists.isEmpty(suppliers)}" class="text-center text-slate-500 py-12">
        <p class="mb-2" th:text="#{suppliers.list.empty}">No suppliers yet.</p>
        <a href="/suppliers/new" class="text-primary-600 font-medium">Add your first supplier →</a>
    </div>

    <ul class="space-y-2">
        <li th:each="s : ${suppliers}">
            <a th:href="@{/suppliers/{id}/edit(id=${s.id})}"
               class="block bg-white border border-slate-200 rounded-xl p-3 hover:border-primary-400">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-medium" th:text="${s.name}"></div>
                        <div class="text-xs text-slate-500">
                            <span th:if="${s.phone}" th:text="${s.phone}"></span>
                            <span th:if="${s.address}" th:text="' · ' + ${s.address}"></span>
                        </div>
                    </div>
                    <div class="flex gap-1 flex-wrap justify-end">
                        <span th:if="${s.bankAccountNumber}"
                              class="text-[10px] px-2 py-0.5 rounded-full chip-green">Bank</span>
                        <span th:if="${s.upiId}"
                              class="text-[10px] px-2 py-0.5 rounded-full chip-yellow">UPI</span>
                    </div>
                </div>
            </a>
        </li>
    </ul>
</section>
</body>
</html>
