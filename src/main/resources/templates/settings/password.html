<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body th:replace="~{fragments/layout :: body(~{::section}, 'settings')}">
<section>
    <div class="flex items-center gap-3 mb-4">
        <a href="/settings" class="text-primary-600">←</a>
        <h1 class="text-xl font-semibold">Change Password</h1>
    </div>

    <div th:if="${error}" class="mb-3 p-3 rounded-lg bg-red-50 text-red-700 text-sm" th:text="${error}"></div>
    <div th:if="${success}" class="mb-3 p-3 rounded-lg bg-emerald-50 text-emerald-700 text-sm" th:text="${success}"></div>

    <form th:action="@{/settings/password}" method="post" autocomplete="off"
          class="space-y-4 bg-white rounded-xl border border-slate-200 p-4">
        <div>
            <label class="text-sm font-medium text-slate-700">Current password</label>
            <input name="currentPassword" type="password" required autocomplete="current-password"
                   class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
        </div>
        <div>
            <label class="text-sm font-medium text-slate-700">New password (6+ chars)</label>
            <input name="newPassword" type="password" required minlength="6" autocomplete="new-password"
                   class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
        </div>
        <div>
            <label class="text-sm font-medium text-slate-700">Confirm new password</label>
            <input name="confirmPassword" type="password" required minlength="6" autocomplete="new-password"
                   class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
        </div>
        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-lg">
            Update Password
        </button>
    </form>
</section>
</body>
</html>
