<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body th:replace="~{fragments/layout :: body(~{::section}, 'settings')}">
<section>
    <div class="flex items-center gap-3 mb-4">
        <a href="/settings" class="text-primary-600">←</a>
        <h1 class="text-xl font-semibold">My Profile</h1>
    </div>

    <p class="text-sm text-slate-500 mb-3">
        Your login account details. Clinical credentials (qualification, registration, specialization)
        live on your <a href="/doctors" class="text-primary-600 underline">Doctor record</a> now.
    </p>

    <div th:if="${error}" class="mb-3 p-3 rounded-lg bg-red-50 text-red-700 text-sm" th:text="${error}"></div>
    <div th:if="${success}" class="mb-3 p-3 rounded-lg bg-emerald-50 text-emerald-700 text-sm" th:text="${success}"></div>

    <form th:action="@{/settings/profile}" method="post"
          class="space-y-4 bg-white rounded-xl border border-slate-200 p-4">

        <div>
            <label class="text-sm font-medium text-slate-700">Full name *</label>
            <input name="fullName" required th:value="${me.fullName}" maxlength="128"
                   class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
        </div>

        <div>
            <label class="text-sm font-medium text-slate-700">Phone</label>
            <input name="phone" type="tel" inputmode="numeric"
                   pattern="^[6-9][0-9]{9}$" maxlength="10" placeholder="9876543210"
                   th:value="${me.phone}"
                   class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
            <p class="text-xs text-slate-400 mt-1">Optional. 10-digit Indian mobile.</p>
        </div>

        <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 rounded-lg">
            Save Profile
        </button>
    </form>
</section>
</body>
</html>
