<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Medicine')}"></head>
<body th:replace="~{fragments/layout :: body(~{::section}, 'inventory')}">
<section>
    <div class="flex items-center justify-between mb-3">
        <a href="/inventory" class="text-primary-600">← Inventory</a>
        <!-- Shared-catalog medicines (clinic_id NULL) are read-only for clinics: editing would affect every tenant. -->
        <span th:if="${medicine.clinicId == null}" class="text-xs text-slate-500">Shared catalog</span>
        <div th:if="${medicine.clinicId != null}" class="flex items-center gap-3" sec:authorize="hasAnyRole('OWNER','PHARMACIST')">
            <a th:href="@{/inventory/medicines/{id}/edit(id=${medicine.id})}" class="text-sm text-primary-600">Edit</a>
            <form th:action="@{/inventory/medicines/{id}/delete(id=${medicine.id})}" method="post" class="m-0">
                <button type="submit" class="text-sm text-red-600"
                        onclick="return confirm('Delete this medicine? It will be hidden from inventory but old sales/prescriptions referencing it stay intact.')">
                    Delete
                </button>
            </form>
        </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-xl p-4 mb-4">
        <h1 class="text-xl font-semibold" th:text="${medicine.name}"></h1>
        <p class="text-sm text-slate-500">
            <span th:if="${medicine.strength}" th:text="${medicine.strength}"></span>
            <span th:if="${medicine.form}" th:text="' · ' + ${medicine.form}"></span>
            <span th:if="${medicine.genericName}" th:text="' · ' + ${medicine.genericName}"></span>
        </p>
        <div class="mt-3 flex items-baseline gap-2">
            <span class="text-3xl font-bold" th:text="${total}"></span>
            <span class="text-sm text-slate-500" th:text="${medicine.unit} + 's in stock'"></span>
            <!-- Same rule as the Alerts page (AlertsService): at or below the threshold is low. -->
            <span th:if="${total != null and medicine.lowStockThreshold != null and total &lt;= medicine.lowStockThreshold}"
                  class="ml-auto text-xs px-2 py-0.5 rounded-full chip-red">LOW STOCK</span>
        </div>
    </div>

    <div th:if="${error}" class="mb-3 p-3 rounded-lg bg-red-50 text-red-700 text-sm" th:text="${error}"></div>

    <div x-data="{ open: false }" x-init="open = $el.dataset.open === 'true'"
         th:data-open="${(newSupplierId != null or error != null) ? 'true' : 'false'}">
        <div class="flex items-center justify-between mb-2">
            <h2 class="font-semibold">Batches</h2>
            <button sec:authorize="hasAnyRole('OWNER','PHARMACIST')"
                    type="button" @click="open = !open"
                    class="bg-primary-600 text-white text-sm px-3 py-1.5 rounded-lg">+ Add Batch</button>
        </div>

        <form x-show="open" x-transition x-cloak
              th:action="@{/inventory/medicines/{id}/batches(id=${medicine.id})}" method="post"
              class="bg-white border border-slate-200 rounded-xl p-4 mb-3 space-y-3">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-sm font-medium text-slate-700">Batch # *</label>
                    <input name="batchNumber" required
                           class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-700">Expiry *</label>
                    <input name="expiryDate" type="date" required th:min="${tomorrow}"
                           class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
                    <p class="text-xs text-slate-400 mt-0.5">Must be a future date.</p>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="text-sm font-medium text-slate-700">Qty *</label>
                    <input name="quantity" type="number" min="1" required inputmode="numeric"
                           class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-700">Buy ₹</label>
                    <input name="purchasePrice" type="number" min="0" step="0.01" inputmode="decimal"
                           class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
                </div>
                <div>
                    <label class="text-sm font-medium text-slate-700">Sell ₹</label>
                    <input name="salePrice" type="number" min="0" step="0.01" inputmode="decimal"
                           class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none"/>
                </div>
            </div>
            <div>
                <div class="flex items-center justify-between">
                    <label class="text-sm font-medium text-slate-700">Supplier</label>
                    <a th:href="@{/suppliers/new(returnTo=${'/inventory/medicines/' + medicine.id})}"
                       class="text-xs text-primary-600 font-medium">+ New supplier</a>
                </div>
                <select name="supplierId"
                        class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary-500 focus:outline-none">
                    <option value="">—</option>
                    <option th:each="s : ${suppliers}" th:value="${s.id}"
                            th:selected="${newSupplierId != null and s.id == newSupplierId}"
                            th:text="${s.name}"></option>
                </select>
            </div>
            <button type="submit" class="w-full bg-primary-600 text-white font-semibold py-2.5 rounded-lg">Save Batch</button>
        </form>

        <ul class="space-y-2">
            <li th:each="b : ${batches}" x-data="{ editing: false }"
                class="bg-white border border-slate-200 rounded-xl p-3">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="font-medium" th:text="'#' + ${b.batchNumber}"></div>
                        <div class="text-xs text-slate-500"
                             th:text="'expires ' + ${#temporals.format(b.expiryDate, 'dd MMM yyyy')}"></div>
                    </div>
                    <div class="text-right">
                        <div sec:authorize="hasAnyRole('OWNER','PHARMACIST')"
                             class="font-semibold cursor-pointer" @click="editing = !editing" th:text="${b.quantity}"></div>
                        <div sec:authorize="!hasAnyRole('OWNER','PHARMACIST')"
                             class="font-semibold" th:text="${b.quantity}"></div>
                        <span class="text-xs" style="padding:2px 8px; border-radius:9999px; display:inline-block;"
                              th:classappend="${batchClass[b.id]}"
                              th:text="${batchLabel[b.id]}"></span>
                    </div>
                </div>
                <form sec:authorize="hasAnyRole('OWNER','PHARMACIST')"
                      x-show="editing" x-transition x-cloak
                      th:action="@{/inventory/batches/{id}/adjust(id=${b.id})}" method="post"
                      class="mt-3 pt-3 border-t border-slate-100 flex gap-2">
                    <input type="hidden" name="medicineId" th:value="${medicine.id}"/>
                    <input name="newQuantity" type="number" min="0" required th:value="${b.quantity}"
                           class="w-20 px-2 py-1.5 rounded-lg border border-slate-300 text-sm"/>
                    <input name="reason" placeholder="reason (optional)"
                           class="flex-1 px-2 py-1.5 rounded-lg border border-slate-300 text-sm"/>
                    <button type="submit" class="bg-primary-600 text-white text-sm px-3 py-1.5 rounded-lg">Save</button>
                </form>
            </li>
        </ul>
        <div th:if="${#lists.isEmpty(batches)}" class="text-center text-slate-500 py-6">
            No batches yet — tap “Add Batch”.
        </div>
    </div>
</section>
</body>
</html>
