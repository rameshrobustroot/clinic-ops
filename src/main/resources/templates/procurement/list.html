<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Procurement')}"></head>
<body th:replace="~{fragments/layout :: body(~{::section}, 'inventory')}">
<section x-data="{ showAddForm: false }">
    <div class="flex items-center justify-between mb-3">
        <h1 class="text-xl font-semibold">Procurement</h1>
        <button type="button" @click="showAddForm = !showAddForm"
                class="bg-primary-600 text-white px-3 py-2 rounded-lg text-sm font-medium">+ Add Item</button>
    </div>

    <form x-show="showAddForm" x-transition x-cloak
          th:action="@{/procurement/add}" method="post"
          class="bg-white border border-slate-200 rounded-xl p-3 mb-3 space-y-2">
        <input name="medicineName" required placeholder="Medicine name to procure"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm"/>
        <input name="notes" placeholder="Notes (optional — e.g. quantity, brand pref)"
               class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm"/>
        <button type="submit" class="w-full bg-primary-600 text-white text-sm font-semibold py-2 rounded-lg">Save</button>
    </form>

    <div class="flex gap-2 text-xs mb-3">
        <a href="/procurement"
           th:classappend="${!showAll} ? 'bg-primary-600 text-white' : 'bg-slate-100 text-slate-600'"
           class="px-3 py-1.5 rounded-full font-medium">Pending</a>
        <a href="/procurement?view=all"
           th:classappend="${showAll} ? 'bg-primary-600 text-white' : 'bg-slate-100 text-slate-600'"
           class="px-3 py-1.5 rounded-full font-medium">All</a>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="text-center text-slate-500 py-12">
        <p class="mb-2" th:text="${showAll} ? 'No procurement items yet.' : 'No pending items 🎉'"></p>
    </div>

    <ul class="space-y-2">
        <li th:each="it : ${items}" class="bg-white border border-slate-200 rounded-xl p-3">
            <div class="flex items-start justify-between gap-3">
                <div class="flex-1">
                    <div class="font-medium" th:text="${it.medicineName}"></div>
                    <div class="text-xs text-slate-500 mt-0.5">
                        <span th:text="${it.source}"></span>
                        <span th:if="${it.sourceVisitId != null}" th:text="' · visit #' + ${it.sourceVisitId}"></span>
                        <span th:text="' · ' + ${#temporals.format(it.createdAt, 'dd MMM HH:mm')}"></span>
                    </div>
                    <div th:if="${it.notes}" class="text-xs text-slate-600 mt-1" th:text="${it.notes}"></div>
                </div>
                <div class="flex flex-col items-end gap-1">
                    <span class="text-xs px-2 py-0.5 rounded-full"
                          th:classappend="${it.status.name() == 'PENDING'} ? 'chip-yellow' :
                                           (${it.status.name() == 'ORDERED'} ? 'chip-yellow' :
                                            (${it.status.name() == 'RECEIVED'} ? 'chip-green' : 'chip-gray'))"
                          th:text="${it.status}"></span>
                </div>
            </div>
            <form th:if="${it.status.name() != 'RECEIVED' and it.status.name() != 'CANCELLED'}"
                  th:action="@{/procurement/{id}/status(id=${it.id})}" method="post"
                  class="flex gap-2 mt-2 pt-2 border-t border-slate-100">
                <button th:if="${it.status.name() == 'PENDING'}" type="submit" name="status" value="ORDERED"
                        class="text-xs bg-primary-600 text-white px-3 py-1 rounded-lg">Mark Ordered</button>
                <button type="submit" name="status" value="RECEIVED"
                        class="text-xs bg-primary-700 text-white px-3 py-1 rounded-lg">Mark Received</button>
                <button type="submit" name="status" value="CANCELLED"
                        class="text-xs bg-slate-500 text-white px-3 py-1 rounded-lg ml-auto">Cancel</button>
            </form>
        </li>
    </ul>
</section>
</body>
</html>
